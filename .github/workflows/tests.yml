name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Security check (slopsquatting defense)
        run: python tools/verify_deps.py

      - name: Ruff lint
        run: ruff check techna/ tools/ techna.py tests/

      - name: Mypy (package)
        run: mypy techna

      - name: Mypy (CLI entry)
        run: mypy techna.py

      - name: Run offline test suite
        run: python -m pytest -q
